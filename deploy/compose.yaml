name: hkshop

services:
  sql:
    image: ${HKSHOP_SQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${HKSHOP_SQL_SA_PASSWORD:?Set a SQL Server development password}
    ports:
      - "127.0.0.1:${HKSHOP_SQL_PORT:-1433}:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - database

  mailpit:
    image: ${HKSHOP_MAILPIT_IMAGE:-axllent/mailpit:v1.27}
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - web

  seq:
    image: ${HKSHOP_SEQ_IMAGE:-datalust/seq:latest}
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    ports:
      - "127.0.0.1:${HKSHOP_SEQ_PORT:-5341}:80"
    volumes:
      - seq_data:/data
    networks:
      - web
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://127.0.0.1:${HKSHOP_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${HKSHOP_KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - web
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.2
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - "--bootstrap-server"
      - "kafka:19092"
      - "--create"
      - "--if-not-exists"
      - "--topic"
      - "${HKSHOP_KAFKA_CHECKOUT_TOPIC:-hkshop.checkout.requests.v1}"
      - "--partitions"
      - "1"
      - "--replication-factor"
      - "1"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - web

  app:
    profiles: [staging]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_HTTP_PORTS: 8080
      AllowedHosts: ${HKSHOP_HOSTNAME:-localhost};app
      ConnectionStrings__HKShop: ${HKSHOP_APP_CONNECTION:-}
      Shop__PublicOrigin: https://${HKSHOP_HOSTNAME:-localhost}
      Shop__MediaPath: /var/lib/hkshop/media
      Shop__KeysPath: /var/lib/hkshop/keys
      S3__ServiceUrl: ${HKSHOP_S3_SERVICE_URL:-}
      S3__Region: ${HKSHOP_S3_REGION:-auto}
      S3__Bucket: ${HKSHOP_S3_BUCKET:-}
      S3__AccessKey: ${HKSHOP_S3_ACCESS_KEY:-}
      S3__SecretKey: ${HKSHOP_S3_SECRET_KEY:-}
      S3__KeyPrefix: ${HKSHOP_S3_KEY_PREFIX:-products}
      S3__PublicBaseUrl: ${HKSHOP_S3_PUBLIC_BASE_URL:-}
      S3__ForcePathStyle: ${HKSHOP_S3_FORCE_PATH_STYLE:-true}
      Smtp__Host: mailpit
      Seq__ServerUrl: http://seq:5341
      Seq__ApiKey: ${HKSHOP_SEQ_API_KEY:-}
      Kafka__BootstrapServers: kafka:19092
      Kafka__CheckoutTopic: ${HKSHOP_KAFKA_CHECKOUT_TOPIC:-hkshop.checkout.requests.v1}
      Kafka__CheckoutGroupId: ${HKSHOP_KAFKA_CHECKOUT_GROUP_ID:-hkshop.checkout.v1}
      SePay__MerchantId: ${HKSHOP_SEPAY_MERCHANT_ID:-}
      SePay__MerchantSecret: ${HKSHOP_SEPAY_MERCHANT_SECRET:-}
      SePay__IpnSecret: ${HKSHOP_SEPAY_IPN_SECRET:-}
      Transport__Enabled: ${HKSHOP_TRANSPORT_ENABLED:-false}
      Transport__RoutingBaseUrl: ${HKSHOP_TRANSPORT_ROUTING_BASE_URL:-}
      Transport__BankName: ${HKSHOP_TRANSPORT_BANK_NAME:-}
      Transport__BankAccount: ${HKSHOP_TRANSPORT_BANK_ACCOUNT:-}
      Transport__BankWebhookKey: ${HKSHOP_TRANSPORT_BANK_WEBHOOK_KEY:-}
      Bootstrap__AdminEmail: ${HKSHOP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${HKSHOP_ADMIN_PASSWORD:-}
      Proxy__KnownProxy: 172.29.88.10
    volumes:
      - media_data:/var/lib/hkshop/media
      - key_data:/var/lib/hkshop/keys
    networks:
      - database
      - web
    depends_on:
      sql:
        condition: service_started
      mailpit:
        condition: service_started
      seq:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  proxy:
    profiles: [staging]
    image: ${HKSHOP_CADDY_IMAGE:-caddy:2.10-alpine}
    environment:
      HKSHOP_HOSTNAME: ${HKSHOP_HOSTNAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    networks:
      web:
        ipv4_address: 172.29.88.10
    depends_on:
      - app
    restart: unless-stopped

  minio:
    profiles: [s3]
    image: ${HKSHOP_MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${HKSHOP_S3_ACCESS_KEY:-hkshop-minio}
      MINIO_ROOT_PASSWORD: ${HKSHOP_S3_SECRET_KEY:-hkshop-minio-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - web
    restart: unless-stopped

  minio-init:
    profiles: [s3]
    image: ${HKSHOP_MC_IMAGE:-cgr.dev/chainguard/minio-client:latest-dev}
    depends_on:
      - minio
    environment:
      MINIO_USER: ${HKSHOP_S3_ACCESS_KEY:-hkshop-minio}
      MINIO_PASSWORD: ${HKSHOP_S3_SECRET_KEY:-hkshop-minio-secret}
      MINIO_BUCKET: ${HKSHOP_S3_BUCKET:-hkshop-media}
    entrypoint: >
      /bin/sh -eu -c '
      until mc alias set local http://minio:9000 "$$MINIO_USER" "$$MINIO_PASSWORD"; do sleep 1; done;
      mc mb --ignore-existing "local/$$MINIO_BUCKET";
      mc anonymous set download "local/$$MINIO_BUCKET";
      '
    networks:
      - web
    restart: "no"

networks:
  web:
    ipam:
      config:
        - subnet: 172.29.88.0/24
  database:

volumes:
  sql_data:
  kafka_data:
  seq_data:
  media_data:
  key_data:
  proxy_data:
  proxy_config:
  minio_data:
